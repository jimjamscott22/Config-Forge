[package]
name = "config-forge"
version = "0.1.0"
description = "A local-first terminal configuration studio"
authors = ["Config Forge contributors"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "config_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

